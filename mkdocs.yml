site_name: CAT Companion
site_description: Extra, bilingual material for the game development and XR modules at XJTLU (CAT105TC / CAT204TC / CAT207TC).
site_url: https://sonettogu14.github.io/cat-companion/
repo_name: SonettoGu14/cat-companion
repo_url: https://github.com/SonettoGu14/cat-companion
edit_uri: edit/main/docs/
copyright: Yankuang Gu · Companion material for CAT105TC / CAT204TC / CAT207TC

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      separator: '[\s\-\.]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            How to use this site: 使用说明
            Maths: 数学基础
            Overview: 概览
            Vectors and the dot product: 向量与点乘
            Shaders: 着色器
            What happens in a shader: 着色器里发生了什么
            Narrative: 叙事手法
            Narrative structure: 叙事结构
            McGuffin: 麦高芬
            The Hero's Journey: 英雄之路
            Worldbuilding: 世界观
            High fantasy: 高魔
            Cyberpunk: 赛博朋克
            Lovecraftian horror: 洛夫克拉夫特式
            High concept: 高概念
            XR: XR
            Glossary: 术语表
            Reference: 参考与配置

nav:
  - Home: index.md
  - How to use this site: start/scope.md
  - Maths:
      - Overview: maths/index.md
      - Vectors and the dot product: maths/vectors-and-dot-product.md
  - Shaders:
      - Overview: shaders/index.md
      - What happens in a shader: shaders/what-happens-in-a-shader.md
  - Narrative:
      - Overview: narrative/index.md
      - Narrative structure:
          - McGuffin: narrative/mcguffin.md
          - The Hero's Journey: narrative/hero-journey.md
          - High concept: narrative/high-concept.md
      - Worldbuilding:
          - Overview: narrative/worldbuilding/index.md
          - High fantasy: narrative/worldbuilding/high-fantasy.md
          - Cyberpunk: narrative/worldbuilding/cyberpunk.md
          - Lovecraftian horror: narrative/worldbuilding/lovecraftian.md
  - XR:
      - Overview: xr/index.md
  - Glossary: glossary/index.md
  - Reference: reference/index.md
